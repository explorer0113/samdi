# Worker 설정 예시 — 쓰려면 samdi.worker.yaml 또는 ~/.samdi/worker.yaml로 복사한다.
# 전체 키 목록과 기본값: docs/configuration.md

controlPlane:
  url: http://127.0.0.1:3000
  workerKey: demo-worker-key
  # 데모 이벤트 주입(UI의 "이벤트 주입", demo-cli)에만 쓰인다
  channelKey: demo-channel-key

worker:
  id: worker-1
  # 이 Worker가 claim할 라벨. 채널의 label과 맞아야 Task를 가져간다.
  labels: [demo]
  pollIntervalMs: 2000
  leaseSeconds: 600
  # 로컬 보고 API + UI용 API 포트 (루프백 전용)
  reportPort: 4700
  # 동시에 처리할 Task 수. 1이면 사람을 기다리는 작업 뒤가 전부 밀린다.
  concurrency: 1

# 시작 전 사람 승인 — 기본은 전부 받는다. 에이전트 종류와 무관하게 Worker가 강제한다.
startGate:
  requireApproval: true
  autoPassLabels: []       # 예: [reports] — 이 라벨은 승인 없이 실행
  autoPassChannels: []     # 예: [cron]

# Task에 agent 지정이 없을 때 쓸 에이전트
# mock | claude-code (Terminal 창을 띄워 진행 과정을 보며 개입할 수 있다, macOS)
defaultAgent: mock

agents:
  claude-code:
    # bin: /usr/local/bin/claude   # 생략하면 PATH에서 찾는다
    # 보고용 curl은 반드시 허용돼 있어야 한다
    allowedTools: Bash(curl *)
    # permissionMode: acceptEdits
    cwd: ~/.samdi/agent-workspace
    timeoutMs: 600000
