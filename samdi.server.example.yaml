# Control Plane 설정 예시 — 쓰려면 samdi.server.yaml로 복사한다.
# 전체 키 목록과 기본값: docs/configuration.md

port: 3000
host: 127.0.0.1
dbPath: samdi.sqlite

# Worker가 claim/보고에 사용하는 공용 키
workerKey: demo-worker-key

# lease 만료 스캔 주기 (밀리초). 만료된 Task는 stalled로 옮겨진다.
sweepIntervalMs: 30000

# 웹훅을 받을 채널. 시작할 때 DB로 동기화된다.
# 엔드포인트: POST /channels/<id>/events  (헤더 x-channel-key: <key>)
channels:
  - id: demo
    label: demo
    key: demo-channel-key
  # - id: mail
  #   label: inbox
  #   key: 여기에-충분히-긴-임의-문자열
